schema_version: 1
id: ui-ux
version: 1
selection:
  task_types: [ui-ux]
quality_policy: strict
# dispatchSpecialistStep records a no-UI reason before skipping this whole workflow.
# Unknown UI applicability blocks; it is never interpreted as no UI.
steps:
  - id: design
    role: designer
    needs: []
    skills: [frontend-design-quality, ui-ux-review-checklist]
    rules: [project-baseline, approval-gates, evidence-and-tests]
    capability_profile: analysis
    output_contract: analysis-result-v1
  - id: implement
    role: developer
    needs: [design]
    skills: [test-driven-development, minimal-change, frontend-design-quality]
    rules: [project-baseline, approval-gates, evidence-and-tests, architecture-boundaries]
    capability_profile: coding
    output_contract: implementation-result-v1
  - id: verify
    role: designer
    needs: [implement]
    skills: [verification-before-completion, ui-ux-review-checklist]
    rules: [project-baseline, approval-gates, evidence-and-tests]
    capability_profile: testing
    output_contract: verification-result-v1
  - id: review
    role: reviewer
    needs: [verify]
    skills: [independent-review]
    rules: [project-baseline, approval-gates, evidence-and-tests]
    capability_profile: review
    output_contract: review-result-v1
gates:
  # Re-evaluate current estimates before every step, including paid design tools.
  - id: design-cost-approved
    before: design
    policy: approved-cost
  - id: implement-cost-approved
    before: implement
    policy: approved-cost
  - id: verify-cost-approved
    before: verify
    policy: approved-cost
  - id: review-cost-approved
    before: review
    policy: approved-cost
  # Checks reference hashed artifacts: design rationale/flows and rendered visual evidence.
  - id: design-evidence
    after: design
    policy: design-evidence
  - id: visual-evidence
    after: verify
    policy: visual-evidence
  - id: ready-to-merge
    after: review
    policy: develop-merge
