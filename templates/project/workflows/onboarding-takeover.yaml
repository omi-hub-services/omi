schema_version: 1
id: onboarding-takeover
version: 1
selection:
  task_types: [onboarding]
quality_policy: strict
steps:
  - id: survey
    role: analyst
    needs: []
    skills: [requirements-analysis]
    rules: [project-baseline]
    capability_profile: analysis
    output_contract: analysis-result-v1
  - id: map-architecture
    role: architect
    needs: [survey]
    skills: [requirements-analysis, minimal-change]
    rules: [project-baseline, architecture-boundaries]
    capability_profile: analysis
    output_contract: analysis-result-v1
  - id: baseline-verify
    role: qa
    needs: [survey]
    skills: [verification-before-completion]
    rules: [project-baseline, evidence-and-tests]
    capability_profile: testing
    output_contract: verification-result-v1
  - id: review
    role: reviewer
    needs: [map-architecture, baseline-verify]
    skills: [independent-review]
    rules: [project-baseline]
    capability_profile: review
    output_contract: review-result-v1
gates:
  - id: takeover-approved
    after: review
    policy: approved-business-baseline
