name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # typecheck, build, lint, format, architecture guards, backlog manifest, generated-schema
      # drift (schemas:check), unit + integration + contract tests. `build` joined with the first src/
      # module (OMI-007, ADR-0011).
      - run: npm run check

  issue-link:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      # Only explicit "Issue: #N" (or the Issue URL) lines count; other mentions such as the
      # parent Epic must not satisfy the check. Every listed Issue must exist and not be a PR.
      - name: PR declares real Issue(s) with an "Issue:" line
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          refs=$(printf '%s\n' "$PR_BODY" | tr -d '\r' \
            | grep -iE "^Issue:[[:space:]]*(#[0-9]+|https://github\.com/${REPO}/issues/[0-9]+)[[:space:]]*$" \
            | sed -E 's/[[:space:]]+$//' | grep -oE '[0-9]+$' | sort -u || true)
          if [ -z "$refs" ]; then
            echo "::error::PR body needs a line 'Issue: #N' naming an Issue of ${REPO}."
            exit 1
          fi
          for n in $refs; do
            kind=$(gh api "repos/${REPO}/issues/${n}" --jq 'if .pull_request then "pr" else "issue" end' 2>/dev/null || echo missing)
            if [ "$kind" != "issue" ]; then
              echo "::error::'Issue: #${n}' is not an existing Issue of ${REPO} (${kind})."
              exit 1
            fi
            echo "Linked Issue: https://github.com/${REPO}/issues/${n}"
          done
