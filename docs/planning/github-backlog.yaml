  - key: OMI-015
    title: "Profile registry & selector"
    type: task
    parent: EP-03
    milestone: M2
    priority: P0
    role: Developer
    area: adapters
    workflow: feature
    blocked_by: [OMI-004, OMI-008, OMI-009]
    objective: "Registry profile local và chọn executor theo khả dụng → capability → concurrency → preference → độ bận."
    scope:
      in:
        - "Metadata không chứa token; trạng thái unknown/ready/busy/cooldown/login-required/unavailable/disabled."
      out:
        - "Suy năng lực từ tên model; hứa đọc quota."
    acceptance_criteria:
      - "Local metadata, TTL/cooldown/account-group/concurrency."
      - "Chọn đủ capability."
      - "unknown và login-required thể hiện đúng."
    implementation_map:
      - "src/domain/profiles/, src/domain/agents/selection-policy.ts"
      - "src/application/use-cases/profiles/{probe-profile,select-executor}.ts"
      - "src/infrastructure/profiles/"
      - "tests/unit/domain/, tests/integration/profiles/"

  - key: OMI-016
    title: "Session supervisor/runtime"
    type: task
    parent: EP-03
