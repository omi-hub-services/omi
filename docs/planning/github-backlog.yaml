# omi-squad — GitHub backlog manifest (machine-readable)
#
# STATUS: bootstrap seed, frozen 2026-11-10. GitHub Issues/Project are now the source of truth
# for task content and status (AGENTS.md §8). Do not edit this file to change tasks, and do
# not re-run `apply` (it would overwrite edits made on GitHub). Issues added after bootstrap
# (e.g. OMI-049) exist only on GitHub.
#
# Historical (until 2026-11-10): derived from docs/planning/project-plan.md (v1.0) and
# cross-checked against it by `npm run check:backlog`; both are now baseline records.
# Plan keys (EP-xx / OMI-xxx) are stable logical keys, NOT GitHub issue numbers.
# Applied by tools/github-bootstrap/main.ts (validate | plan | apply). Every issue
# body carries the marker `<!-- omi-squad:plan-key=KEY -->` used for idempotent reuse.
#
# Field notes:
# - role: primary role (GitHub Project "Role" option); role_detail keeps the plan's wording.
# - workflow: omi-squad workflow template used to deliver the issue.
# - milestone: from project-plan.md §2, never derived from the parent Epic.
#   EP-04 and EP-05 span M2–M3, so they carry no single native milestone.
# - review.approval: PO approval needed beyond the standard gates (none = standard gates only).

schema_version: 1
project:
  owner: omi-hub-services
  repository: omi
  title: "omi-squad delivery"
  default_branch: main
  integration_branch: develop

milestones:
  - key: M0
    title: "M0 — Feasibility"
    description: "OMI-001–006. Exit: hai CLI chạy bằng subscription; profile/lifecycle/GitHub có bằng chứng; blockers được ghi rõ."
  - key: M1
    title: "M1 — Core foundation"
    description: "OMI-007–012. Exit: schema, domain, state, transaction, CLI/IPC và artifact foundation kiểm thử được."
  - key: M2
    title: "M2 — Execution"
    description: "OMI-013–018; OMI-021, OMI-024, OMI-026, OMI-027. Exit: chạy worker, worktree, checkpoint/recovery, quản lý profile và failover."
  - key: M3
    title: "M3 — Task delivery"
    description: "OMI-019, 020, 022, 023, 025, 028, 029, 030. Exit: Issue → workflow tối thiểu → test/review → merge develop → Done; parallel/approval hoạt động."
  - key: M4
    title: "M4 — Full lifecycle"
    description: "OMI-031–042. Exit: bộ template đủ vòng đời, release và deploy có hai điểm duyệt riêng."
  - key: M5
    title: "M5 — v0.1 acceptance"
    description: "OMI-043–048. Exit: fault tests, clean install, beta và release framework được PO duyệt."

# GitHub Project fields (project-plan.md §6). Status and Milestone are native fields;
# Status options are replaced only when they differ. Iteration is not created: work is
# assigned by milestone (plan: "Không bắt buộc nếu PO giao theo milestone").
fields:
  - name: Status
    native: true
    options:
      [Backlog, Ready, In Progress, In Review, Waiting Approval, Waiting Resource, Blocked, Done]
  - name: Priority
    options: [P0, P1, P2]
  - name: Work Type
    options: [Epic, Spike, Task, Bug, Docs, Release]
  - name: Workflow
    options: [init, research, feature, bugfix, refactor, docs, release, deploy]
  - name: Role
    options: [Architect, Developer, BA, Designer, QA, DevOps, Writer, Release Manager]
  - name: Area
    options: [domain, runtime, adapters, github, workflows, delivery, tooling]
  - name: Plan Key
    text: true
  - name: Run ID
    text: true
  - name: Blocked Reason
    text: true

# Project views (project-plan.md §6). The API sets name, layout, filter and visible fields only;
# grouping, sorting and board columns are UI steps listed in docs/planning/github-project.md.
views:
  - name: Delivery Board
    layout: board
    filter: "-work-type:Epic"
    fields: [Title, Status, Assignees, Priority, Milestone, Plan Key]
  - name: Backlog
    layout: table
    filter: "-status:Done"
    fields: [Title, Status, Milestone, Priority, Work Type, Role, Area, Parent issue, Plan Key]
  - name: Epic Breakdown
    layout: table
    filter: "-work-type:Epic"
    fields: [Title, Parent issue, Status, Milestone, Priority, Plan Key]
  - name: Needs PO
    layout: table
    filter: 'status:"Waiting Approval",Blocked'
    fields: [Title, Status, Blocked Reason, Priority, Milestone, Plan Key]
  - name: Active Runs
    layout: table
    filter: 'status:"In Progress","In Review","Waiting Resource"'
    fields: [Title, Status, Run ID, Role, Assignees, Linked pull requests, Plan Key]
  - name: Release Readiness
    layout: table
    filter: "work-type:Release"
    fields: [Title, Status, Milestone, Linked pull requests, Sub-issues progress, Plan Key]

defaults:
  review:
    checks: ["npm run check (local) và CI xanh trên đúng head SHA của PR"]
    reviewers: ["Một reviewer độc lập (khác run/agent triển khai) review revision cố định"]
    approval: none

issues:
  # ───────────────────────────── EP-01 ─────────────────────────────
  - key: EP-01
    title: "Bootstrap & feasibility"
    type: epic
    milestone: M0
    area: tooling
    objective: "Xác minh nền tảng trước đầu tư lớn: scaffold repo, chạy được Claude Code và Codex bằng subscription, nhiều profile, lifecycle WSL2 và năng lực GitHub."
    outcome:
      - "Hai CLI chạy bằng subscription; profile/lifecycle/GitHub có bằng chứng; blockers được ghi rõ (exit gate M0)."
      - "Output PoC đặt trong tests/live/ hoặc adapter spike có ADR; evidence tóm tắt trong docs/architecture/adr/; code tạm không thành module production ngoài cấu trúc."

  - key: OMI-001
    title: "Scaffold clean architecture"
    type: task
    parent: EP-01
    milestone: M0
    priority: P0
    role: Architect
    role_detail: "Architect/Developer"
    area: tooling
    workflow: feature
    blocked_by: []
    objective: "Repository framework có cấu trúc, công cụ và quy tắc kiểm tra đúng architecture.md để mọi task sau đặt code đúng chỗ ngay từ đầu."
    scope:
      in:
        - "Root/src/tests/docs/templates theo bản đồ architecture.md §3; placeholder tối thiểu cho thư mục chưa có code."
        - "npm scripts cơ bản (build, typecheck, lint, format:check, check:architecture, test:unit, test:integration, check)."
        - "AGENTS.md (rules có thẩm quyền) và CLAUDE.md (tham chiếu)."
        - "Architecture guard baseline: import direction, cycles, root allowlist, vị trí/tên file; CI chạy các kiểm tra đã có."
      out:
        - "Runtime, adapters, CLI sản phẩm `omi`, profile switching."
        - "Guard đầy đủ naming/schema drift (OMI-043)."
    acceptance_criteria:
      - "Tạo đúng root/src/tests/docs/templates theo architecture.md §3."
      - "npm scripts cơ bản tồn tại và chạy thật, không có script giả lập kết quả."
      - "AGENTS/CLAUDE rules được tạo; CLAUDE.md tham chiếu AGENTS.md, không chép bộ quy tắc riêng."
      - "Architecture guard baseline có fixtures chứng minh: import hợp lệ được chấp nhận, import sai chiều bị chặn, circular bị chặn, file/root path trái quy ước bị phát hiện."
      - "build/typecheck/lint chạy."
      - "Không có file ngoài quy ước (check-structure pass trên repo)."
    implementation_map:
      - "Root config: package.json, tsconfig*.json, eslint.config.js, vitest.config.ts, .dependency-cruiser.cjs, .nvmrc, .npmrc, .gitignore"
      - "tools/check-structure.ts; tests/integration/tools/, tests/unit/tools/, tests/fixtures/architecture/"
      - ".github/workflows/ci.yml, .github/pull_request_template.md, .github/ISSUE_TEMPLATE/"
      - "docs/architecture/adr/0011-bootstrap-toolchain.md"
    review:
      reviewers:
        [
          "Reviewer độc lập (người/agent khác run triển khai) kiểm tra cấu trúc so với architecture.md",
        ]

  - key: OMI-002
    title: "PoC Claude Code subscription worker"
    type: spike
    parent: EP-01
    milestone: M0
    priority: P0
    role: Developer
    area: adapters
    workflow: research
    blocked_by: [OMI-001]
    objective: "Chứng minh có thể chạy một worker Claude Code không tương tác bằng đăng nhập subscription để đọc và sửa một repo tạm."
    scope:
      in:
        - "Chạy `claude -p` (không dùng `--bare`, vì bare mode không dùng subscription login) trên repo tạm."
        - "Ghi version, auth mode, log đã khử secret; kiểm tra success/error/cancel."
      out:
        - "Adapter production (OMI-013); multi-profile (OMI-004)."
        - "Dùng API key thay subscription."
    acceptance_criteria:
      - "Một step read-only rồi một step sửa repo tạm qua CLI subscription."
      - "Log/version/auth mode được ghi lại và đã khử secret."
      - "Kiểm tra các trường hợp success, error và cancel."
      - "Không dùng API key để thay thế."
    implementation_map:
      - "tests/live/ (PoC opt-in, không chạy trong CI mặc định)"
      - "docs/architecture/adr/ (ADR + evidence tóm tắt); docs/operations/compatibility.md"
    review:
      checks:
        [
          "Evidence chạy thật (lệnh, exit status, thời điểm, version) đính kèm; npm run check xanh nếu có code",
        ]

  - key: OMI-003
    title: "PoC Codex subscription worker"
    type: spike
    parent: EP-01
    milestone: M0
    priority: P0
    role: Developer
    area: adapters
    workflow: research
    blocked_by: [OMI-001]
    objective: "Chứng minh có thể chạy worker Codex không tương tác bằng auth subscription đã lưu, trả kết quả có cấu trúc."
    scope:
      in:
        - "Chạy `codex exec` với JSON output/schema trên repo tạm; một step read-only và một step sửa."
        - "Xác định auth cache (file dưới CODEX_HOME hoặc OS store) phù hợp; log đã khử secret; success/error/cancel."
      out:
        - "Adapter production (OMI-014); sửa refresh token thủ công."
    acceptance_criteria:
      - "Tương tự OMI-002 bằng Codex: một step read-only rồi step sửa repo tạm qua CLI subscription; log/version/auth mode đã khử secret; kiểm tra success/error/cancel; không dùng API key."
      - "Chứng minh result có cấu trúc."
      - "Chứng minh auth cache phù hợp."
    implementation_map:
      - "tests/live/"
      - "docs/architecture/adr/; docs/operations/compatibility.md"
    review:
      checks: ["Evidence chạy thật đính kèm; npm run check xanh nếu có code"]

  - key: OMI-004
    title: "PoC nhiều profile và continuation"
    type: spike
    parent: EP-01
    milestone: M0
    priority: P0
    role: Architect
    area: adapters
    workflow: research
    blocked_by: [OMI-002, OMI-003]
    objective: "Xác minh có thể isolate nhiều profile subscription cho mỗi tool và tiếp tục công việc từ checkpoint khi đổi profile."
    scope:
      in:
        - "Hai profile mỗi tool nếu PO cung cấp; kiểm tra isolation (kể cả keyring/profile namespace, token refresh concurrent của Codex)."
        - "Checkpoint continuation; fault injection limit."
      out:
        - "Đổi auth global qua lại khi có process song song."
    acceptance_criteria:
      - "Hai profile mỗi tool nếu PO cung cấp."
      - "Chứng minh isolation và checkpoint continuation."
      - "Fault injection limit không bắt buộc tiêu hao quota thật; phân biệt lỗi giả lập với quota detection thật."
      - "Ghi rõ điểm chưa chứng minh."
      - "Nếu không đạt auto failover: báo blocker sản phẩm, không đóng Issue thành Done bằng phương án manual."
    implementation_map:
      - "tests/live/"
      - "docs/architecture/adr/ (kết luận isolation, giới hạn)"
    review:
      reviewers: ["Reviewer độc lập + PO xem kết luận blocker nếu không đạt"]
      approval: "PO cung cấp profile thử nghiệm; PO quyết định nếu auto failover không khả thi"

  - key: OMI-005
    title: "PoC lifecycle WSL2"
    type: spike
    parent: EP-01
    milestone: M0
    priority: P0
    role: Developer
    area: runtime
    workflow: research
    blocked_by: [OMI-002, OMI-003]
    objective: "Chứng minh supervisor nhận biết Coordinator thoát và dừng đúng nhóm process worker trong WSL2."
    scope:
      in:
        - "Supervisor launch có quản lý; graceful và abrupt stop; process group."
      out:
        - "System service/daemon tự khởi động."
    acceptance_criteria:
      - "Supervisor nhận biết Coordinator exit, dừng process group."
      - "Test graceful và abrupt stop."
      - "Giữ file chưa commit."
      - "Không kill phiên không thuộc framework."
    implementation_map:
      - "tests/live/ (chạy trong WSL2)"
      - "docs/architecture/adr/"

  - key: OMI-006
    title: "PoC GitHub capability"
    type: spike
    parent: EP-01
    milestone: M0
    priority: P0
    role: DevOps
    area: github
    workflow: research
    blocked_by: [OMI-001]
    objective: "Lập capability matrix GitHub thực tế cho repo/Project/plan đang dùng."
    scope:
      in:
        - "Sandbox repo/Project riêng; không dùng repo production."
      out:
        - "Adapter production (OMI-019, OMI-022, OMI-024)."
    acceptance_criteria:
      - "Sandbox repo/Project: đọc/ghi field, Issue/sub-issue/dependency, PR link và merge permission."
      - "Xác minh actor approval, native checks, deployment gate."
      - "Capability matrix rõ."
    implementation_map:
      - "tests/live/"
      - "docs/architecture/adr/ (capability matrix); tham khảo docs/planning/github-project.md"

  # ───────────────────────────── EP-02 ─────────────────────────────
  - key: EP-02
    title: "Domain & persistent state"
    type: epic
    milestone: M1
    area: domain
    objective: "State và contract đáng tin cậy."
    outcome:
      - "Schema, domain, state, transaction, CLI/IPC và artifact foundation kiểm thử được (exit gate M1)."

  - key: OMI-007
    title: "Contract/schema v1"
    type: task
    parent: EP-02
    milestone: M1
    priority: P0
    role: Developer
    area: domain
    workflow: feature
    blocked_by: [OMI-001]
    objective: "Contract v1 có kiểu và JSON Schema sinh tự động cho workflow, config, context, result và command."
    scope:
      in:
        - "Zod 4 schemas + z.infer trong src/application/contracts/; sinh JSON Schema vào schemas/."
        - "Script schemas:generate / schemas:check."
      out:
        - "Domain không import contract/Zod."
    acceptance_criteria:
      - "Zod schemas cho workflow/config/context/result/command."
      - "Generated JSON Schema trong schemas/ (không viết tay trùng nguồn)."
      - "Reject input sai."
      - "Có schema version và schema drift test."
    implementation_map:
      - "src/application/contracts/"
      - "schemas/ (generated)"
      - "tools/ (codegen); tests/unit/application/contracts/"
      - "Khi thêm module src/ đầu tiên: đưa `npm run build` vào `check` và CI (đang tạm loại vì src/ chưa có input — xem ADR-0011)."

  - key: OMI-008
    title: "Domain policies/state machines"
    type: task
    parent: EP-02
    milestone: M1
    priority: P0
    role: Developer
    area: domain
    workflow: feature
    blocked_by: [OMI-007]
    objective: "Các policy và state machine thuần cho task, run, approval, merge, capability và 2+Architect+2."
    scope:
      in:
        - "Transition tường minh (nguồn, event, precondition, đích); reason code."
      out:
        - "I/O, đọc thời gian ngầm."
    acceptance_criteria:
      - "Task/run/approval/merge/capability và 2+Architect+2."
      - "Pure tests cho boundary/invalid transition."
      - "domain/ không I/O."
    implementation_map:
      - "src/domain/{tasks,workflows,runs,agents,profiles,approvals,delivery,shared}/"
      - "tests/unit/domain/"

  - key: OMI-009
    title: "SQLite schema/migration"
    type: task
    parent: EP-02
    milestone: M1
    priority: P0
    role: Developer
    area: runtime
    workflow: feature
    blocked_by: [OMI-007]
    objective: "State schema SQLite và migration runner có checksum đáp ứng các bảng trong architecture.md §8."
    scope:
      in:
        - "better-sqlite3 (kiểm tra native module trên Node/WSL2 baseline); SQL thuần; foreign_keys, WAL, synchronous FULL, busy timeout."
      out:
        - "ORM."
    acceptance_criteria:
      - "Tables/index/FK/unique từ architecture."
      - "Migration có checksum; WAL/FULL."
      - "Restart và rollback transaction test."
    implementation_map:
      - "migrations/0001-initial-state.sql"
      - "src/infrastructure/persistence/sqlite/"
      - "tests/integration/persistence/"

  - key: OMI-010
    title: "Transaction, leases và audit"
    type: task
    parent: EP-02
    milestone: M1
    priority: P0
    role: Developer
    area: runtime
    workflow: feature
    blocked_by: [OMI-008, OMI-009]
    objective: "Cập nhật state + event + outbox nguyên tử; lease có generation/fencing đảm bảo một writer."
    scope:
      in:
        - "Transaction ngắn, đồng bộ; compare-and-swap version."
      out:
        - "await agent/network trong transaction."
    acceptance_criteria:
      - "State+event+outbox atomic."
      - "Generation/lease stale bị từ chối."
      - "Một writer/worktree."
      - "Test competing claim và late event."
    implementation_map:
      - "src/application/ports/ (RunStore, OperationStore...)"
      - "src/infrastructure/persistence/sqlite/"
      - "tests/integration/persistence/"

  - key: OMI-011
    title: "CLI/IPC skeleton"
    type: task
    parent: EP-02
    milestone: M1
    priority: P0
    role: Developer
    area: runtime
    workflow: feature
    blocked_by: [OMI-007, OMI-009]
    objective: "Khung CLI (Commander) và IPC có version để Coordinator gọi runtime."
    scope:
      in:
        - "Handler mỏng; presenters text/JSON; IPC qua Unix socket có framing và giới hạn payload."
      out:
        - "Command truy cập SQL trực tiếp."
    acceptance_criteria:
      - "Commander handlers mỏng."
      - "Versioned IPC; text/JSON output; framing/error/exit codes."
      - "Command không truy cập SQL trực tiếp."
    implementation_map:
      - "src/interfaces/cli/commands/, src/interfaces/cli/presenters/, src/interfaces/ipc/"
      - "src/bootstrap/cli.ts, src/bootstrap/container.ts"
      - "tests/integration/ipc/"

  - key: OMI-012
    title: "Artifact store & context packet"
    type: task
    parent: EP-02
    milestone: M1
    priority: P0
    role: Developer
    area: runtime
    workflow: feature
    blocked_by: [OMI-007, OMI-009]
    objective: "Artifact được ghi nguyên tử có hash/manifest; context packet chọn lọc đầu vào cho từng step."
    scope:
      in:
        - "temp → fsync → rename → DB reference; packet theo architecture.md §6.2."
      out:
        - "Nhét toàn bộ repo/transcript vào packet."
    acceptance_criteria:
      - "Atomic write/hash/manifest."
      - "Packet chọn lọc skills/rules/input."
      - "Path validation và missing artifact test."
      - "Không chứa credential."
    implementation_map:
